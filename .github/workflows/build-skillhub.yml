name: Build skillhub branch

on:
  push:
    branches: [main]
    paths:
      - "skills/**"
      - "scripts/**"
      - ".github/workflows/build-skillhub.yml"
  workflow_run:
    workflows: ["Sync upstream"]
    types: [completed]
  schedule:
    - cron: "40 3 * * *" # daily safety net; all 29 skills are published and uniformly versioned 1.2.3+r1.
        # Push/workflow_run triggers above handle upstream syncs regardless.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preflight only (build + dry-run publish, no real publish)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-skillhub
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch previous state (skillhub branch)
        run: |
          set -e
          mkdir -p state-dir
          if git ls-remote --exit-code origin refs/heads/skillhub >/dev/null 2>&1; then
            git fetch --no-tags --depth 1 origin skillhub
            git archive "$(git rev-parse FETCH_HEAD)" | tar -x -C state-dir
            test -f state-dir/state.json
            echo "fetched previous state from skillhub branch"
          else
            echo "skillhub branch does not exist yet - starting with fresh state"
          fi

      - name: Build artifacts
        id: build
        run: node scripts/build.mjs dist state-dir

      - name: Publish changed skills
        id: publish
        env:
          SKILLHUB_TOKEN: ${{ secrets.SKILLHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '' }}
        run: node scripts/publish.mjs dist

      - name: Push skillhub branch
        if: always() && steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/push-branch.sh
