name: Sync upstream

on:
  schedule:
    - cron: "17 2 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: write # merge-upstream API creates a merge commit on the fork
  # NOTE: GITHUB_TOKEN can never merge commits that touch .github/workflows
  # (GitHub hard-blocks this; the `workflows` permission key does not exist).
  # When upstream ships workflow changes this job fails on purpose - sync once
  # via the web "Sync fork" button (user identity has the workflow scope),
  # which then re-triggers the build workflow automatically.

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork main with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync ${{ github.repository }} --source mattpocock/skills --branch main
