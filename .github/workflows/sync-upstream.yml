name: Sync upstream

on:
  schedule:
    - cron: "17 2 * * 1" # weekly, Monday
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork main with upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh repo sync ${{ github.repository }} --source mattpocock/skills --branch main
